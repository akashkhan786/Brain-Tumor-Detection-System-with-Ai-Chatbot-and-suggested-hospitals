<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tumor Detection System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <style>
        body{
            font-family: 'Arial' ,sans-serif;
            background: #f8f9fa
        }
        .container{
            max-width: 600px;
            margin: 0 auto;
        }
        .card{
            border-radius: 15px;
            border-color: black;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="text-center">
            <h1 class="display-4 text-primary">MRI Tumor Detection System</h1>
            <p class="lead text-secondary">Upload an Image to Detect if there is Tumor or its type</p>
        </div>
       <!-- upload file -->
        <div class="card-show p-4 mt-4">
            <form method="post" enctype="multipart/form-data" >
                <div class="mb-3">
                    <label for="file" class="form-label">Select Mri image</label>
                    <input type="file" class="form-control id='file" name="file" accept="image/*"  required >
                </div>
                <button type="submit" class="btn btn-primary">Upload and Detect</button>
            </form>
        </div>

        {% if result %}
    <div class="results mt-4">
        <div class="card shadow">
            <div class="card-body">
                <h4 class="card-title">{{ result }}</h4>
                <p class="card-text text-muted">Confidence: {{ confidence }}%</p>
                <img src="{{ file_path }}" class="img-fluid rounded" alt="">
            </div>
        </div>
    </div>
{% else %}
    <p>No result available</p>
{% endif %}


    </div>    
</body>
</html>
